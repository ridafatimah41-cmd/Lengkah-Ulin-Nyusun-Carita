<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNCAT - Lengkah Ulin Nyusun Carita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdf4; overflow-x: hidden; }
        h1, h2, h3, .font-title { font-family: 'Fredoka One', cursive; }
        
        .board-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            background: #dcfce7;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .board-cell {
            background-color: #ffffff;
            border: 2px solid #bbf7d0;
            border-radius: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.8rem;
            color: #16a34a;
        }

        .cell-emoji { font-size: 2rem; }
        .cell-name { font-size: 0.6rem; color: #374151; text-transform: capitalize; margin-top: -4px;}
        
        /* Pewarnaan sel seperti papan catur */
        .board-cell:nth-child(even) { background-color: #fef3c7; border-color: #fde68a; }

        .pawn {
            position: absolute;
            font-size: 1.5rem;
            transition: all 0.5s ease;
            z-index: 10;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.3));
        }

        /* Offset pion agar jika ada di kotak yang sama tidak bertumpuk */
        .pawn-0 { transform: translate(-10px, -10px); }
        .pawn-1 { transform: translate(10px, -10px); }
        .pawn-2 { transform: translate(-10px, 10px); }
        .pawn-3 { transform: translate(10px, 10px); }

        .dice-anim { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-15deg); }
            100% { transform: rotate(0deg); }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 4px; }
    </style>
</head>
<body class="bg-green-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Musik Latar (Akan diputar setelah user interaksi) -->
    <audio id="bgm" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-carefree-ukulele-163.mp3" type="audio/mpeg">
    </audio>

    <!-- Header -->
    <header class="bg-green-500 text-white p-4 text-center shadow-md relative z-20">
        <h1 class="text-3xl md:text-4xl drop-shadow-md">LUNCAT</h1>
        <p class="text-sm md:text-base font-bold">Lengkah Ulin Nyusun Carita</p>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 relative z-10 w-full max-w-4xl mx-auto">
        
        <!-- LAYAR 1: PILIH BAHASA -->
        <div id="screen-language" class="w-full text-center bg-white p-8 rounded-2xl shadow-xl border-4 border-green-200">
            <h2 class="text-2xl mb-8 font-title text-green-600">Pilih Bahasa / Pilih Basa</h2>
            <div class="flex flex-col md:flex-row justify-center gap-6">
                <button onclick="setLanguage('id')" class="bg-red-500 hover:bg-red-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-2">
                    🇮🇩 Bahasa Indonesia
                </button>
                <button onclick="setLanguage('su')" class="bg-blue-500 hover:bg-blue-600 text-white text-xl font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-2">
                    🌿 Basa Sunda
                </button>
            </div>
            <p class="mt-6 text-gray-500 text-sm">Pastikan volume suara perangkat Anda sudah menyala!</p>
        </div>

        <!-- LAYAR 2: INPUT NAMA -->
        <div id="screen-setup" class="hidden w-full text-center bg-white p-6 rounded-2xl shadow-xl border-4 border-green-200 max-w-md">
            <h2 id="setup-title" class="text-xl mb-4 font-title text-green-600">Masukkan Nama Pemain</h2>
            <div class="space-y-4">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">👦🏻</span>
                    <input type="text" id="p1-name" class="flex-grow border-2 border-red-300 rounded-lg p-2 text-lg focus:outline-none focus:border-red-500 font-bold text-red-600 placeholder-red-200" placeholder="Pemain 1 (Merah)">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-2xl">👧🏻</span>
                    <input type="text" id="p2-name" class="flex-grow border-2 border-yellow-300 rounded-lg p-2 text-lg focus:outline-none focus:border-yellow-500 font-bold text-yellow-600 placeholder-yellow-200" placeholder="Pemain 2 (Kuning)">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-2xl">👦🏻</span>
                    <input type="text" id="p3-name" class="flex-grow border-2 border-blue-300 rounded-lg p-2 text-lg focus:outline-none focus:border-blue-500 font-bold text-blue-600 placeholder-blue-200" placeholder="Pemain 3 (Biru)">
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-2xl">👧🏻</span>
                    <input type="text" id="p4-name" class="flex-grow border-2 border-green-300 rounded-lg p-2 text-lg focus:outline-none focus:border-green-500 font-bold text-green-600 placeholder-green-200" placeholder="Pemain 4 (Hijau)">
                </div>
            </div>
            <button onclick="startGame()" id="btn-start" class="mt-6 w-full bg-green-500 hover:bg-green-600 text-white font-title text-xl py-3 rounded-xl shadow-lg transform transition hover:scale-105">
                Mulai Bermain!
            </button>
            <p id="error-msg" class="text-red-500 font-bold mt-2 hidden text-sm"></p>
        </div>

        <!-- LAYAR 3: PAPAN PERMAINAN -->
        <div id="screen-game" class="hidden w-full flex-col items-center">
            
            <div class="w-full max-w-600 flex justify-between items-center mb-4 bg-white p-3 rounded-xl shadow-md border-2 border-green-200">
                <div class="text-left">
                    <p id="round-indicator" class="font-bold text-gray-500 text-sm md:text-base">Putaran 1 / 2</p>
                    <p class="font-title text-lg md:text-2xl text-green-600" id="turn-indicator">Giliran: Pemain 1</p>
                </div>
                <div class="text-right flex items-center gap-2">
                    <div id="dice-display" class="text-5xl">🎲</div>
                    <button id="btn-roll" onclick="rollDice()" class="bg-yellow-400 hover:bg-yellow-500 text-white font-title text-lg md:text-xl py-2 px-4 rounded-xl shadow-md transform transition active:scale-95 border-b-4 border-yellow-600">
                        Lempar!
                    </button>
                </div>
            </div>

            <!-- Papan Grid -->
            <div class="board-container relative" id="board">
                <!-- Sel dan Pion akan dirender oleh JavaScript -->
            </div>
            
            <p id="instruction-text" class="mt-4 text-center font-bold text-green-700 bg-green-100 py-2 px-4 rounded-full shadow-sm animate-pulse">
                Dengarkan instruksi!
            </p>
        </div>

        <!-- LAYAR 4: HASIL (NYARITA) -->
        <div id="screen-result" class="hidden w-full max-w-4xl">
            <div class="bg-white p-6 rounded-2xl shadow-xl border-4 border-green-300 text-center">
                <h2 id="result-title" class="text-3xl font-title text-green-600 mb-2">Waktunya Bercerita!</h2>
                <p id="result-subtitle" class="text-gray-600 font-bold mb-6">Ayo susun cerita dari gambar yang kalian dapatkan!</p>
                
                <div id="result-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Kartu hasil per pemain dirender JS -->
                </div>

                <button onclick="location.reload()" class="mt-8 bg-blue-500 hover:bg-blue-600 text-white font-title text-xl py-3 px-8 rounded-xl shadow-lg transform transition hover:scale-105">
                    Main Lagi
                </button>
            </div>
        </div>

    </main>

    <script>
        // Data Kosakata (Indonesia & Sunda)
        const dict = {
            id: {
                setupTitle: "Masukkan Nama Pemain",
                p1: "Pemain 1 (Merah)", p2: "Pemain 2 (Kuning)", p3: "Pemain 3 (Biru)", p4: "Pemain 4 (Hijau)",
                btnStart: "Mulai Bermain!",
                errName: "Isi semua nama pemain dulu ya!",
                turn: "Giliran:",
                round: "Putaran",
                btnRoll: "Lempar!",
                resTitle: "Waktunya Bercerita!",
                resSub: "Ayo susun cerita dari gambar yang kalian dapatkan!",
                audioWelcome: "Selamat datang di permainan Luncat! Lengkah Ulin Nyusun Carita. Silakan isi nama pemain.",
                audioTurnTemplate: (name) => `Giliran ${name}, ayo lempar dadu!`,
                audioMoveTemplate: (num, itemName) => itemName ? `Kamu di kotak nomor ${num}. Kamu dapat gambar ${itemName}.` : `Kamu di kotak nomor ${num}. Kotaknya kosong.`,
                audioEnd: "Permainan selesai! Hore! Ayo ceritakan gambar yang kalian dapatkan!",
            },
            su: {
                setupTitle: "Lebetkeun Nami Pamaén",
                p1: "Pamaén 1 (Beureum)", p2: "Pamaén 2 (Konéng)", p3: "Pamaén 3 (Biru)", p4: "Pamaén 4 (Héjo)",
                btnStart: "Ngawitan Ulin!",
                errName: "Eusian heula sadaya nami pamaénna nya!",
                turn: "Bagian:",
                round: "Ronde",
                btnRoll: "Alungkeun!",
                resTitle: "Waktosna Nyarita!",
                resSub: "Hayu susun carita tina gambar anu dipikaboga ku hidep!",
                audioWelcome: "Wilujeng sumping di kaulinan Luncat! Lengkah Ulin Nyusun Carita. Mangga lebetkeun nami pamaén.",
                audioTurnTemplate: (name) => `Bagian ${name}, hayu alungkeun daduna!`,
                audioMoveTemplate: (num, itemName) => itemName ? `Hidep di kotak nomer ${num}. Kenging gambar ${itemName}.` : `Hidep di kotak nomer ${num}. Kotakna kosong.`,
                audioEnd: "Kaulinan réngsé! Hore! Hayu caritakeun gambar anu dipikaboga ku hidep!",
            }
        };

        // Fungsi mengubah angka ke pelafalan Sunda (agar TTS membaca dengan benar)
        function getSundaNumber(n) {
            const units = ['','hiji','dua','tilu','opat','lima','genep','tujuh','dalapan','salapan'];
            if(n === 10) return 'sapuluh';
            if(n === 11) return 'sabelas';
            if(n > 11 && n < 20) return units[n%10] + ' belas';
            if(n >= 20) {
                let ten = units[Math.floor(n/10)] + ' puluh';
                let unit = units[n%10];
                return unit ? ten + ' ' + unit : ten;
            }
            return units[n];
        }

        // Data Gambar Lengkap 36 Kotak (Sebelum dikosongkan 5)
        const allItems = [
            { icon: '🐱', idName: 'kucing', suName: 'ucing' },
            { icon: '🐶', idName: 'anjing', suName: 'anjing' },
            { icon: '🐔', idName: 'ayam', suName: 'hayam' },
            { icon: '🦆', idName: 'bebek', suName: 'meri' },
            { icon: '🐮', idName: 'sapi', suName: 'sapi' },
            { icon: '🐐', idName: 'kambing', suName: 'embé' },
            { icon: '🐴', idName: 'kuda', suName: 'kuda' },
            { icon: '🐦', idName: 'burung', suName: 'manuk' },
            { icon: '🐟', idName: 'ikan', suName: 'lauk' },
            { icon: '🍌', idName: 'pohon pisang', suName: 'tangkal cau' },
            { icon: '🥥', idName: 'kelapa', suName: 'kalapa' },
            { icon: '🌹', idName: 'bunga mawar', suName: 'kembang mawar' },
            { icon: '🌼', idName: 'bunga melati', suName: 'kembang malati' },
            { icon: '🥭', idName: 'mangga', suName: 'mangga' },
            { icon: '🍈', idName: 'pepaya', suName: 'gedang' },
            { icon: '🍠', idName: 'singkong', suName: 'sampeu' },
            { icon: '🌾', idName: 'padi', suName: 'paré' },
            { icon: '🎋', idName: 'bambu', suName: 'awi' },
            { icon: '🦋', idName: 'kupu-kupu', suName: 'kukupu' },
            { icon: '🐸', idName: 'katak', suName: 'bangkong' },
            { icon: '🐍', idName: 'ular', suName: 'oray' },
            { icon: '🐭', idName: 'tikus', suName: 'beurit' },
            { icon: '🐒', idName: 'monyet', suName: 'monyét' },
            { icon: '🐯', idName: 'harimau', suName: 'maung' },
            { icon: '🐘', idName: 'gajah', suName: 'gajah' },
            { icon: '🍃', idName: 'daun', suName: 'daun' },
            { icon: '🌽', idName: 'jagung', suName: 'jagong' },
            { icon: '🐰', idName: 'kelinci', suName: 'kelenci' },
            { icon: '🐝', idName: 'lebah', suName: 'nyiruan' },
            { icon: '🐜', idName: 'semut', suName: 'sireum' },
            { icon: '🕷️', idName: 'laba-laba', suName: 'lancah' },
            { icon: '🦉', idName: 'burung hantu', suName: 'bueuk' },
            { icon: '🐌', idName: 'siput', suName: 'kéong' },
            { icon: '🌺', idName: 'bunga sepatu', suName: 'kembang sapatu' },
            { icon: '🍅', idName: 'tomat', suName: 'tomat' },
            { icon: '🌲', idName: 'pohon cemara', suName: 'tangkal camara' }
        ];

        let lang = 'id'; 
        let cells = [];
        let players = [];
        let currentPlayerIndex = 0;
        let currentRound = 1;
        const maxRounds = 2; // Hanya 2 putaran sesuai request
        let isMoving = false;

        // Inisialisasi Audio Engine
        const synth = window.speechSynthesis;
        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID'; // Gunakan engine ID agar pelafalan jelas
            utterance.rate = 0.85; // Diperlambat sedikit untuk anak-anak
            synth.speak(utterance);
        }

        // Set Bahasa dan Putar Musik
        function setLanguage(selectedLang) {
            lang = selectedLang;
            
            // Putar BGM
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; // Suara latar pelan agar instruksi jelas
            bgm.play().catch(e => console.log("Audio play diizinkan setelah interaksi"));

            // Ubah Teks UI Setup
            document.getElementById('setup-title').innerText = dict[lang].setupTitle;
            document.getElementById('p1-name').placeholder = dict[lang].p1;
            document.getElementById('p2-name').placeholder = dict[lang].p2;
            document.getElementById('p3-name').placeholder = dict[lang].p3;
            document.getElementById('p4-name').placeholder = dict[lang].p4;
            document.getElementById('btn-start').innerText = dict[lang].btnStart;

            // Sapaan
            speak(dict[lang].audioWelcome);

            // Pindah Layar
            document.getElementById('screen-language').classList.add('hidden');
            document.getElementById('screen-setup').classList.remove('hidden');
        }

        function startGame() {
            const p1 = document.getElementById('p1-name').value.trim();
            const p2 = document.getElementById('p2-name').value.trim();
            const p3 = document.getElementById('p3-name').value.trim();
            const p4 = document.getElementById('p4-name').value.trim();
            const errMsg = document.getElementById('error-msg');

            if (!p1 || !p2 || !p3 || !p4) {
                errMsg.innerText = dict[lang].errName;
                errMsg.classList.remove('hidden');
                speak(dict[lang].errName);
                return;
            }

            players = [
                { id: 1, name: p1, avatar: '👦🏻', color: 'red', position: 0, items: [] },
                { id: 2, name: p2, avatar: '👧🏻', color: 'yellow', position: 0, items: [] },
                { id: 3, name: p3, avatar: '👦🏻', color: 'blue', position: 0, items: [] },
                { id: 4, name: p4, avatar: '👧🏻', color: 'green', position: 0, items: [] }
            ];

            generateBoard();
            
            // Ubah UI Game
            document.getElementById('btn-roll').innerText = dict[lang].btnRoll;
            
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('flex');

            updateUI();
            announceTurn();
        }

        function generateBoard() {
            // Acak 5 kotak kosong
            let emptyIndices = [];
            while(emptyIndices.length < 5) {
                let r = Math.floor(Math.random() * 36);
                if(!emptyIndices.includes(r)) emptyIndices.push(r);
            }

            cells = allItems.map((item, index) => {
                if(emptyIndices.includes(index)) {
                    return { icon: '', idName: '', suName: '' }; // Dikosongkan
                }
                return item;
            });

            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            
            // Render 36 Kotak (Zig-zag)
            for (let i = 36; i >= 1; i--) {
                let row = Math.ceil(i / 6);
                let col = i % 6 === 0 ? 6 : i % 6;
                let actualNum = i;
                if (row % 2 === 0) actualNum = (row * 6) - col + 1;

                let cellData = cells[actualNum - 1];
                let displayName = lang === 'id' ? cellData.idName : cellData.suName;

                let cellEl = document.createElement('div');
                cellEl.className = 'board-cell';
                cellEl.id = `cell-${actualNum}`;
                cellEl.innerHTML = `
                    <span class="cell-number">${actualNum}</span>
                    <span class="cell-emoji">${cellData.icon}</span>
                    <span class="cell-name">${displayName}</span>
                `;
                boardDiv.appendChild(cellEl);
            }

            // Letakkan pion di luar (posisi 0 - disembunyikan sementara)
            players.forEach((p, i) => {
                let pawn = document.createElement('div');
                pawn.className = `pawn pawn-${i}`;
                pawn.id = `pawn-${p.id}`;
                pawn.innerText = p.avatar;
                pawn.style.display = 'none';
                boardDiv.appendChild(pawn);
            });
        }

        function announceTurn() {
            const player = players[currentPlayerIndex];
            const text = dict[lang].audioTurnTemplate(player.name);
            document.getElementById('instruction-text').innerText = text;
            speak(text);
        }

        function rollDice() {
            if (isMoving) return;
            isMoving = true;
            
            const diceDiv = document.getElementById('dice-display');
            diceDiv.classList.add('dice-anim');
            
            // Angka dadu Sunda
            const diceSu = ['','hiji','dua','tilu','opat','lima','genep'];
            
            setTimeout(() => {
                diceDiv.classList.remove('dice-anim');
                const roll = Math.floor(Math.random() * 6) + 1;
                
                // Set dadu visual
                const diceIcons = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
                diceDiv.innerText = diceIcons[roll];
                
                let textDadu = lang === 'id' ? `Dadu ${roll}.` : `Dadu ${diceSu[roll]}.`;
                document.getElementById('instruction-text').innerText = textDadu;
                speak(textDadu);

                setTimeout(() => movePlayer(roll), 1500); // Tunggu ngomong dadu beres
            }, 500);
        }

        function movePlayer(roll) {
            let player = players[currentPlayerIndex];
            player.position += roll;
            if (player.position > 36) player.position = 36; // Mentok di 36

            let pawn = document.getElementById(`pawn-${player.id}`);
            pawn.style.display = 'block';

            let targetCell = document.getElementById(`cell-${player.position}`);
            let rectBoard = document.getElementById('board').getBoundingClientRect();
            let rectCell = targetCell.getBoundingClientRect();

            // Kalkulasi posisi absolut di dalam grid
            let moveY = rectCell.top - rectBoard.top + 10;
            let moveX = rectCell.left - rectBoard.left + 15;
            
            pawn.style.top = `${moveY}px`;
            pawn.style.left = `${moveX}px`;

            // Cek Hadiah
            setTimeout(() => {
                let cellData = cells[player.position - 1];
                let hasItem = cellData.icon !== '';
                let itemName = lang === 'id' ? cellData.idName : cellData.suName;
                
                if(hasItem) {
                    player.items.push(cellData);
                }

                // Pengucapan
                let numText = lang === 'id' ? player.position : getSundaNumber(player.position);
                let textSpeak = dict[lang].audioMoveTemplate(numText, itemName);
                
                document.getElementById('instruction-text').innerText = textSpeak;
                speak(textSpeak);

                setTimeout(nextTurn, 4000); // Waktu cukup untuk narator ngomong
            }, 600);
        }

        function nextTurn() {
            currentPlayerIndex++;
            if (currentPlayerIndex >= players.length) {
                currentPlayerIndex = 0;
                currentRound++;
            }

            if (currentRound > maxRounds) {
                endGame();
            } else {
                updateUI();
                announceTurn();
                isMoving = false;
            }
        }

        function updateUI() {
            const player = players[currentPlayerIndex];
            const roundText = dict[lang].round;
            const turnText = dict[lang].turn;

            document.getElementById('round-indicator').innerText = `${roundText} ${currentRound} / ${maxRounds}`;
            document.getElementById('turn-indicator').innerText = `${turnText} ${player.name} ${player.avatar}`;
            
            // Ubah warna teks giliran sesuai warna pemain
            const colors = {'red':'text-red-600', 'yellow':'text-yellow-500', 'blue':'text-blue-600', 'green':'text-green-600'};
            document.getElementById('turn-indicator').className = `font-title text-lg md:text-2xl ${colors[player.color]}`;
        }

        function endGame() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('flex');
            document.getElementById('screen-result').classList.remove('hidden');

            document.getElementById('result-title').innerText = dict[lang].resTitle;
            document.getElementById('result-subtitle').innerText = dict[lang].resSub;

            const container = document.getElementById('result-cards');
            container.innerHTML = '';

            const bgColors = {'red':'bg-red-100 border-red-300', 'yellow':'bg-yellow-100 border-yellow-300', 'blue':'bg-blue-100 border-blue-300', 'green':'bg-green-100 border-green-300'};

            players.forEach(p => {
                let itemsHtml = '';
                if(p.items.length === 0) {
                    itemsHtml = `<p class="text-sm text-gray-500 mt-2">Tidak dapat gambar</p>`;
                } else {
                    p.items.forEach(item => {
                        let name = lang === 'id' ? item.idName : item.suName;
                        itemsHtml += `<div class="bg-white p-2 rounded shadow text-center m-1 inline-block">
                            <div class="text-3xl">${item.icon}</div>
                            <div class="text-xs font-bold capitalize mt-1">${name}</div>
                        </div>`;
                    });
                }

                container.innerHTML += `
                    <div class="border-2 rounded-xl p-4 text-left ${bgColors[p.color]}">
                        <div class="text-xl font-title text-gray-800 border-b-2 border-white pb-2 mb-2">
                            ${p.avatar} ${p.name}
                        </div>
                        <div class="flex flex-wrap">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            });

            speak(dict[lang].audioEnd);
        }
    </script>
</body>
</html>
