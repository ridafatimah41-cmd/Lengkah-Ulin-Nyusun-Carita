<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNCAT - Lengkah Ulin Nyusun Carita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
        .pion { position: absolute; width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.5); border: 2px solid white; transition: all 0.5s ease-in-out; z-index: 20; }
        .pion-0 { bottom: 2px; left: 2px; }
        .pion-1 { bottom: 2px; right: 2px; }
        .pion-2 { top: 2px; left: 2px; }
        .pion-3 { top: 2px; right: 2px; }
        /* Animasi masuk */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-sky-100 font-sans min-h-screen flex items-center justify-center p-4 selection:bg-none relative overflow-x-hidden">

    <!-- Musik Latar (Otomatis diputar saat bahasa dipilih) -->
    <audio id="bgm" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_34b3e34b6b.mp3" loop preload="auto"></audio>

    <!-- 1. LAYAR PILIH BAHASA -->
    <div id="lang-screen" class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border-4 border-white fade-in">
        <h1 class="text-5xl font-extrabold text-blue-600 mb-2 drop-shadow-sm">LUNCAT</h1>
        <p class="text-gray-600 mb-8 font-semibold">Lengkah Ulin Nyusun Carita</p>
        
        <h2 class="text-xl font-bold mb-6 text-gray-800">Pilih Bahasa / Pilih Basa</h2>
        <div class="flex flex-col gap-4">
            <button onclick="selectLanguage('id')" class="bg-red-500 hover:bg-red-600 text-white font-bold py-5 rounded-2xl shadow-[0_6px_0_rgb(185,28,28)] active:shadow-none active:translate-y-2 transition-all text-2xl flex items-center justify-center gap-3">
                <span>🇮🇩</span> Bahasa Indonesia
            </button>
            <button onclick="selectLanguage('su')" class="bg-green-500 hover:bg-green-600 text-white font-bold py-5 rounded-2xl shadow-[0_6px_0_rgb(21,128,61)] active:shadow-none active:translate-y-2 transition-all text-2xl flex items-center justify-center gap-3">
                <span>🌿</span> Basa Sunda
            </button>
        </div>
    </div>

    <!-- 2. LAYAR INPUT NAMA -->
    <div id="name-screen" class="hidden bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border-4 border-yellow-300 fade-in">
        <h2 id="name-title" class="text-2xl font-extrabold mb-6 text-gray-800">Masukkan Nama 4 Pemain</h2>
        <div class="flex flex-col gap-4 mb-8">
            <input type="text" id="p1" placeholder="Pemain 1 (Anak Laki-Laki Merah)" class="border-4 border-red-300 p-3 rounded-xl w-full focus:outline-none focus:border-red-500 font-bold text-center text-lg" />
            <input type="text" id="p2" placeholder="Pemain 2 (Anak Laki-Laki Biru)" class="border-4 border-blue-300 p-3 rounded-xl w-full focus:outline-none focus:border-blue-500 font-bold text-center text-lg" />
            <input type="text" id="p3" placeholder="Pemain 3 (Anak Perempuan Kuning)" class="border-4 border-yellow-300 p-3 rounded-xl w-full focus:outline-none focus:border-yellow-500 font-bold text-center text-lg" />
            <input type="text" id="p4" placeholder="Pemain 4 (Anak Perempuan Hijau)" class="border-4 border-green-300 p-3 rounded-xl w-full focus:outline-none focus:border-green-500 font-bold text-center text-lg" />
        </div>
        <button onclick="startGame()" id="btn-start" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-[0_6px_0_rgb(29,78,216)] active:shadow-none active:translate-y-2 transition-all text-2xl">
            Mulai Bermain
        </button>
    </div>

    <!-- 3. LAYAR PAPAN PERMAINAN -->
    <div id="game-screen" class="hidden flex-col items-center w-full max-w-2xl bg-white p-4 sm:p-6 rounded-3xl shadow-2xl border-4 border-yellow-400 fade-in">
        
        <!-- Info Giliran -->
        <div class="flex justify-between w-full mb-4 items-center bg-blue-50 p-3 rounded-2xl border-2 border-blue-200">
            <div id="turn-indicator" class="text-lg sm:text-xl font-extrabold text-blue-700 flex items-center gap-2"></div>
            <div class="bg-white px-4 py-1 rounded-full shadow-sm border border-gray-200 text-sm sm:text-base font-bold text-gray-600">
                <span id="lbl-putaran">Putaran:</span> <span id="turn-count" class="text-blue-600 text-lg">1</span>/3
            </div>
        </div>
        
        <!-- Papan Grid -->
        <div class="bg-sky-200 p-2 sm:p-3 rounded-2xl w-full max-w-fit shadow-inner mb-6 relative">
            <div id="board" class="grid-board relative"></div>
            <!-- Pion-pion -->
            <div id="pion-0" class="pion bg-red-500 text-white shadow-lg hidden">👦🏻</div>
            <div id="pion-1" class="pion bg-blue-500 text-white shadow-lg hidden">👦🏻</div>
            <div id="pion-2" class="pion bg-yellow-400 text-black shadow-lg hidden">👧🏻</div>
            <div id="pion-3" class="pion bg-green-500 text-white shadow-lg hidden">👧🏻</div>
        </div>

        <!-- Dadu & Tombol Kocok -->
        <div class="flex flex-col items-center w-full bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-300">
            <div id="dice" class="w-20 h-20 bg-white border-4 border-gray-800 rounded-2xl shadow-lg flex justify-center items-center text-4xl mb-4 font-bold text-gray-800 transition-transform duration-300">
                🎲
            </div>
            <button id="btn-roll" onclick="rollDice()" class="w-full sm:w-auto bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-extrabold py-3 px-10 rounded-full shadow-[0_6px_0_rgb(202,138,4)] active:shadow-none active:translate-y-2 transition-all text-2xl uppercase tracking-wider">
                Kocok Dadu
            </button>
        </div>
    </div>

    <!-- 4. LAYAR BERCERITA (HASIL AKHIR) -->
    <div id="result-screen" class="hidden bg-white p-6 sm:p-8 rounded-3xl shadow-2xl max-w-3xl w-full text-center border-4 border-green-500 fade-in">
        <h2 id="story-title" class="text-3xl sm:text-5xl font-extrabold text-green-600 mb-8 drop-shadow-sm">Waktunya Bercerita!</h2>
        <p id="story-desc" class="text-lg font-semibold text-gray-600 mb-8"></p>
        <div id="result-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
        <button onclick="location.reload()" class="mt-8 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-[0_4px_0_rgb(29,78,216)] active:translate-y-1 transition-all text-xl">
            Main Lagi
        </button>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Data Bahasa dan Kosakata
        const dict = {
            id: {
                sel_lang_audio: "Halo! Selamat datang di permainan Luncat! Pilih bahasa yang ingin kamu gunakan.",
                input_names_title: "Masukkan Nama 4 Pemain",
                input_names_audio: "Luar biasa! Sekarang, silakan minta guru atau orang tuamu memasukkan nama keempat pemain.",
                start_btn: "Mulai Bermain",
                turn: "Giliran",
                round: "Putaran:",
                roll_dice: "Kocok Dadu",
                game_start_audio: "Hore, permainan dimulai! Ayo kita bermain. Giliran pertama adalah",
                turn_audio: "Giliran",
                roll_audio: "Mengocok dadu!",
                empty_box: "Kosong. Ini kotak angka",
                story_time_title: "Waktunya Bercerita!",
                story_desc: "Ayo buat cerita lucu dari gambar yang kamu kumpulkan!",
                story_time_audio: "Permainan selesai! Hebat semuanya! Sekarang waktunya setiap pemain bercerita menggunakan gambar yang sudah didapatkan.",
                items: ["Kucing", "Ayam", "Burung", "Pohon", "Bunga", "Daun", "Kuda", "Sapi", "Kambing", "Ikan", "Katak", "Kupu-kupu", "Belalang", "Lebah", "Ular", "Harimau", "Gajah", "Monyet", "Bambu", "Rumput", "Jamur", "Pisang", "Singkong", "Jagung", "Alang-alang", "Kelapa", "Mangga", "Petai", "Jengkol", "Cabai Rawit", "Kemiri"]
            },
            su: {
                sel_lang_audio: "Sampurasun! Wilujeng sumping di kaulinan Luncat! Mangga pilih basa nu badé dianggo ku hidep.",
                input_names_title: "Lebetkeun Ngaran 4 Pamaén",
                input_names_audio: "Sae pisan! Ayeuna, mangga lebetkeun ngaran opat pamaén.",
                start_btn: "Mimitian Ulin",
                turn: "Giliran",
                round: "Putaran:",
                roll_dice: "Kocok Dadu",
                game_start_audio: "Hore, kaulinan dimimitian! Hayu urang ulin sasarengan. Giliran kahiji nyaéta",
                turn_audio: "Giliran",
                roll_audio: "Ngocok dadu!",
                empty_box: "Kosong. Ieu kotak angka",
                story_time_title: "Waktuna Nyarita!",
                story_desc: "Hayu urang ngarang carita tina gambar nu dipanggihan!",
                story_time_audio: "Kaulinan réngsé! Hébat sadayana! Ayeuna waktuna unggal pamaén nyarita ngagunakeun gambar nu geus dimeunangkeun.",
                items: ["Ucing", "Hayam", "Manuk", "Tangkal", "Kembang", "Daun", "Kuda", "Sapi", "Embé", "Lauk", "Bangkong", "Kukupu", "Simeut", "Nyiruan", "Oray", "Maung", "Gajah", "Monyét", "Awi", "Jukut", "Suung", "Cau", "Sampeu", "Jagong", "Eurih", "Kalapa", "Manggah", "Peuteuy", "Jéngkol", "Céngék", "Muncang"]
            }
        };

        let selectedLang = 'id';
        let players = [];
        let currentPlayerIndex = 0;
        let turnsPlayed = [0, 0, 0, 0];
        const MAX_TURNS = 3; 
        let playerPositions = [0, 0, 0, 0];
        let playerItems = [[], [], [], []];
        let emptyBoxes = [];
        let boardMap = {}; 

        const avatars = [
            { bg: "bg-red-500", border: "border-red-500", text: "text-white", emoji: "👦🏻" },
            { bg: "bg-blue-500", border: "border-blue-500", text: "text-white", emoji: "👦🏻" },
            { bg: "bg-yellow-400", border: "border-yellow-400", text: "text-black", emoji: "👧🏻" },
            { bg: "bg-green-500", border: "border-green-500", text: "text-white", emoji: "👧🏻" }
        ];

        let speechSynth = window.speechSynthesis;

        // Fungsi membaca teks (Text-To-Speech) khusus anak
        function speak(text) {
            if (speechSynth.speaking) {
                speechSynth.cancel(); 
            }
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'id-ID'; // Gunakan engine ID agar pelafalan ejaan stabil
            msg.pitch = 1.4; // Suara melengking mirip anak-anak
            msg.rate = 0.9;  // Tempo bicara sedikit diperlambat agar jelas
            speechSynth.speak(msg);
        }

        // Konversi angka ke ejaan teks bahasa Sunda (agar TTS membaca dengan benar)
        function speakNumber(num, lang) {
            if (lang === 'id') return num.toString();
            const sundaNums = ["", "Hiji", "Dua", "Tilu", "Opat", "Lima", "Genep", "Tujuh", "Dalapan", "Salapan", "Sapuluh", "Sabelas", "Dua belas", "Tilu belas", "Opat belas", "Lima belas", "Genep belas", "Tujuh belas", "Dalapan belas", "Salapan belas", "Dua puluh", "Dua puluh hiji", "Dua puluh dua", "Dua puluh tilu", "Dua puluh opat", "Dua puluh lima", "Dua puluh genep", "Dua puluh tujuh", "Dua puluh dalapan", "Dua puluh salapan", "Tilu puluh", "Tilu puluh hiji", "Tilu puluh dua", "Tilu puluh tilu", "Tilu puluh opat", "Tilu puluh lima", "Tilu puluh genep"];
            return sundaNums[num] || num.toString();
        }

        function getEmoji(word) {
            const emojis = {
                "Kucing": "🐱", "Ucing": "🐱", "Ayam": "🐔", "Hayam": "🐔", "Burung": "🐦", "Manuk": "🐦",
                "Pohon": "🌳", "Tangkal": "🌳", "Bunga": "🌸", "Kembang": "🌸", "Daun": "🍃",
                "Kuda": "🐴", "Sapi": "🐮", "Kambing": "🐐", "Embé": "🐐", "Ikan": "🐟", "Lauk": "🐟",
                "Katak": "🐸", "Bangkong": "🐸", "Kupu-kupu": "🦋", "Kukupu": "🦋", "Belalang": "🦗", "Simeut": "🦗",
                "Lebah": "🐝", "Nyiruan": "🐝", "Ular": "🐍", "Oray": "🐍", "Harimau": "🐯", "Maung": "🐯",
                "Gajah": "🐘", "Monyet": "🐵", "Monyét": "🐵", "Bambu": "🎋", "Awi": "🎋", "Rumput": "🌱", "Jukut": "🌱",
                "Jamur": "🍄", "Suung": "🍄", "Pisang": "🍌", "Cau": "🍌", "Singkong": "🍠", "Sampeu": "🍠",
                "Jagung": "🌽", "Jagong": "🌽", "Alang-alang": "🌾", "Eurih": "🌾", "Kelapa": "🥥", "Kalapa": "🥥",
                "Mangga": "🥭", "Manggah": "🥭", "Petai": "🫘", "Peuteuy": "🫘", "Jengkol": "🌰", "Jéngkol": "🌰",
                "Cabai Rawit": "🌶️", "Céngék": "🌶️", "Kemiri": "🥜", "Muncang": "🥜"
            };
            return emojis[word] || "🎁";
        }

        // 1. Pilih Bahasa
        function selectLanguage(lang) {
            selectedLang = lang;
            document.getElementById('lang-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
            
            // Putar musik latar
            let bgm = document.getElementById('bgm');
            bgm.volume = 0.2;
            bgm.play().catch(e => console.log("Musik diblokir otomatis oleh browser"));

            // Terjemahkan Teks UI
            document.getElementById('name-title').innerText = dict[lang].input_names_title;
            document.getElementById('btn-start').innerText = dict[lang].start_btn;
            
            speak(dict[lang].input_names_audio);
        }

        // 2. Mulai Permainan
        function startGame() {
            let p1 = document.getElementById('p1').value.trim() || "Pemain 1";
            let p2 = document.getElementById('p2').value.trim() || "Pemain 2";
            let p3 = document.getElementById('p3').value.trim() || "Pemain 3";
            let p4 = document.getElementById('p4').value.trim() || "Pemain 4";

            players = [ {name: p1}, {name: p2}, {name: p3}, {name: p4} ];

            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            document.getElementById('lbl-putaran').innerText = dict[selectedLang].round;
            document.getElementById('btn-roll').innerText = dict[selectedLang].roll_dice;

            setupBoard();
            
            // Tampilkan pion di luar kotak (persiapan masuk)
            for(let i=0; i<4; i++) {
                document.getElementById(`pion-${i}`).classList.remove('hidden');
            }

            updateTurnUI();
            speak(dict[selectedLang].game_start_audio + " " + players[0].name);
        }

        // 3. Buat Papan Game (36 Kotak Zig-Zag)
        function setupBoard() {
            emptyBoxes = [];
            while(emptyBoxes.length < 5) {
                let r = Math.floor(Math.random() * 36) + 1;
                if(!emptyBoxes.includes(r)) emptyBoxes.push(r);
            }
            
            let itemsCopy = [...dict[selectedLang].items];
            let boardHTML = "";
            
            for(let row = 5; row >= 0; row--) {
                for(let col = 0; col < 6; col++) {
                    let isEvenRow = row % 2 === 0;
                    let actualCol = isEvenRow ? col : (5 - col);
                    let num = row * 6 + actualCol + 1;
                    
                    let itemStr = "";
                    let itemEmoji = "";
                    if(!emptyBoxes.includes(num)) {
                        itemStr = itemsCopy.shift();
                        boardMap[num] = itemStr;
                        itemEmoji = getEmoji(itemStr);
                    } else {
                        boardMap[num] = null;
                    }
                    
                    boardHTML += `<div id="box-${num}" class="border-2 border-yellow-400 bg-white/90 w-14 h-14 sm:w-20 sm:h-20 flex flex-col justify-center items-center relative rounded-md shadow-sm">
                        <span class="absolute top-1 left-1 text-[10px] sm:text-xs font-bold text-gray-400">${num}</span>
                        <span class="text-xl sm:text-3xl">${itemEmoji}</span>
                        <span class="text-[8px] sm:text-[10px] font-bold mt-1 text-center leading-tight truncate w-full px-1 text-gray-700">${itemStr || ''}</span>
                    </div>`;
                }
            }
            document.getElementById('board').innerHTML = boardHTML;
        }

        function updateTurnUI() {
            let pName = players[currentPlayerIndex].name;
            let pBg = avatars[currentPlayerIndex].bg;
            let pText = avatars[currentPlayerIndex].text;
            
            let turnIndicator = document.getElementById('turn-indicator');
            turnIndicator.innerHTML = `${dict[selectedLang].turn}: <span class="${pBg} ${pText} px-3 py-1 rounded-xl ml-2 shadow-md flex items-center gap-1">${pName} ${avatars[currentPlayerIndex].emoji}</span>`;
            
            let currentRound = turnsPlayed[currentPlayerIndex] + 1;
            if(currentRound > MAX_TURNS) currentRound = MAX_TURNS;
            document.getElementById('turn-count').innerText = currentRound;
            
            let btnRoll = document.getElementById('btn-roll');
            btnRoll.disabled = false;
            btnRoll.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // 4. Proses Kocok Dadu
        function rollDice() {
            if(turnsPlayed[currentPlayerIndex] >= MAX_TURNS) return;
            
            let btnRoll = document.getElementById('btn-roll');
            btnRoll.disabled = true;
            btnRoll.classList.add('opacity-50', 'cursor-not-allowed');
            
            let diceEl = document.getElementById('dice');
            let rolls = 0;
            
            speak(dict[selectedLang].roll_audio);
            
            let interval = setInterval(() => {
                diceEl.innerText = Math.floor(Math.random() * 6) + 1;
                diceEl.style.transform = `rotate(${Math.random() * 360}deg)`;
                rolls++;
                if (rolls > 12) {
                    clearInterval(interval);
                    let finalDice = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = finalDice;
                    diceEl.style.transform = `rotate(0deg)`;
                    
                    // Sebutkan angka dadu yang keluar
                    speak(speakNumber(finalDice, selectedLang));
                    
                    setTimeout(() => {
                        movePlayer(finalDice);
                    }, 1200);
                }
            }, 80);
        }

        // 5. Pergerakan Pion dan Ambil Gambar
        function movePlayer(dice) {
            let newPos = playerPositions[currentPlayerIndex] + dice;
            if (newPos > 36) newPos = 36;
            playerPositions[currentPlayerIndex] = newPos;
            
            // Pindahkan elemen pion ke dalam kotak grid
            let box = document.getElementById(`box-${newPos}`);
            let pionEl = document.getElementById(`pion-${currentPlayerIndex}`);
            if(box) {
                box.appendChild(pionEl);
            }
            
            // Audio Kotak Tujuan
            setTimeout(() => {
                let numText = speakNumber(newPos, selectedLang);
                let isTempEmpty = emptyBoxes.includes(newPos);
                
                if (isTempEmpty) {
                    speak(`${dict[selectedLang].empty_box} ${numText}`);
                } else {
                    let item = boardMap[newPos];
                    speak(`${numText}. ${item}`);
                    playerItems[currentPlayerIndex].push(item);
                }
                
                // Jeda sebelum pergantian pemain
                setTimeout(() => {
                    turnsPlayed[currentPlayerIndex]++;
                    
                    if(turnsPlayed.every(t => t >= MAX_TURNS)) {
                        endGame();
                    } else {
                        currentPlayerIndex = (currentPlayerIndex + 1) % 4;
                        updateTurnUI();
                        speak(dict[selectedLang].turn_audio + " " + players[currentPlayerIndex].name);
                    }
                }, 3500); 
            }, 1000);
        }

        // 6. Akhir Permainan (Sesi Nyarita)
        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('story-title').innerText = dict[selectedLang].story_time_title;
            document.getElementById('story-desc').innerText = dict[selectedLang].story_desc;
            speak(dict[selectedLang].story_time_audio);
            
            let resultGrid = document.getElementById('result-grid');
            resultGrid.innerHTML = "";
            
            for(let i=0; i<4; i++) {
                let pName = players[i].name;
                let items = playerItems[i];
                let pBg = avatars[i].bg;
                let pText = avatars[i].text;
                let pBorder = avatars[i].border;
                
                let itemsHTML = items.map(item => `
                    <div class="bg-white p-3 rounded-2xl text-center shadow-sm border-2 border-gray-100 flex flex-col items-center justify-center">
                        <div class="text-4xl sm:text-5xl mb-2">${getEmoji(item)}</div>
                        <div class="font-bold text-sm sm:text-base text-gray-800">${item}</div>
                    </div>
                `).join('');
                
                if(items.length === 0) {
                     itemsHTML = `<div class="col-span-3 text-gray-500 italic text-sm py-4">Kosong (Hanya mendarat di kotak angka)</div>`;
                }
                
                resultGrid.innerHTML += `
                    <div class="bg-gray-50 p-5 rounded-3xl shadow-md border-l-8 ${pBorder}">
                        <h3 class="text-xl font-bold mb-4 ${pBg} ${pText} inline-block px-5 py-2 rounded-full shadow-sm">
                            ${pName} ${avatars[i].emoji}
                        </h3>
                        <div class="grid grid-cols-3 gap-3 justify-center">
                            ${itemsHTML}
                        </div>
                    </div>
                `;
            }
        }
        
        // Membantu interaksi awal audio
        document.body.addEventListener('click', function() {
            if (speechSynth.state === 'suspended') {
                speechSynth.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
